workflows:
  android-workflow:
    name: Thalo Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create --platforms=android .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
