workflows:
  android-workflow:
    name: Thalo Android Build
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          set -e
          flutter create --platforms=android --org com.thalo --project-name app .
      - name: Configure Firebase for Android
        script: |
          set -e
          cp google-services.json android/app/google-services.json

          python3 - <<'PYEOF'
          import json

          with open("android/app/google-services.json") as f:
              data = json.load(f)
              package_name = data["client"][0]["client_info"]["android_client_info"]["package_name"]
              print("Using package name:", package_name)

          settings_path = "android/settings.gradle.kts"
          try:
              with open(settings_path) as f:
                  content = f.read()
              if "com.google.gms.google-services" not in content:
                  content = content.replace(
                      "id(\"com.android.application\") version",
                      "id(\"com.google.gms.google-services\") version \"4.4.2\" apply false\n    id(\"com.android.application\") version"
                  )
                  with open(settings_path, "w") as f:
                      f.write(content)
          except FileNotFoundError:
              pass

          app_gradle_kts = "android/app/build.gradle.kts"
          with open(app_gradle_kts) as f:
              content = f.read()

          if "id(\"com.google.gms.google-services\")" not in content:
              content = content.replace(
                  "plugins {",
                  "plugins {\n    id(\"com.google.gms.google-services\")"
              )

          import re
          content = re.sub(r'applicationId\s*=\s*"[^"]*"', f'applicationId = "{package_name}"', content)
          content = re.sub(r'namespace\s*=\s*"[^"]*"', f'namespace = "{package_name}"', content)

          with open(app_gradle_kts, "w") as f:
              f.write(content)
          PYEOF
      - name: Build Thalo APK
        script: |
          set -e
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
