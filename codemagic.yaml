workflows:
  android-workflow:
    name: Thalo Android Build
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          set -e
          flutter create --platforms=android --org com.thalo.app .

      - name: Configure Firebase for Android
        script: |
          set -e
          cp google-services.json android/app/google-services.json

          python3 - <<'PYEOF'
          # 1. Register the google-services plugin in settings.gradle.kts
          settings_path = "android/settings.gradle.kts"
          try:
              with open(settings_path) as f:
                  content = f.read()
              if "com.google.gms.google-services" not in content:
                  content = content.replace(
                      'id("com.android.application") version',
                      'id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.android.application") version',
                      1,
                  )
                  with open(settings_path, "w") as f:
                      f.write(content)
          except FileNotFoundError:
              pass

          # 2. Apply the plugin in app-level build.gradle.kts
          app_gradle_kts = "android/app/build.gradle.kts"
          app_gradle_groovy = "android/app/build.gradle"
          try:
              with open(app_gradle_kts) as f:
                  content = f.read()
              if 'id("com.google.gms.google-services")' not in content:
                  content = content.replace(
                      'plugins {',
                      'plugins {\n    id("com.google.gms.google-services")',
                      1,
                  )
                  with open(app_gradle_kts, "w") as f:
                      f.write(content)
          except FileNotFoundError:
              with open(app_gradle_groovy, "a") as f:
                  f.write("\napply plugin: 'com.google.gms.google-services'\n")
          PYEOF

      - name: Build Thalo APK
        script: |
          set -e
          flutter pub get
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
