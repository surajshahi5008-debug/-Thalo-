workflows:
  android-workflow:
    name: Thalo Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Setup and build
        script: |
          set -e
          echo "Current directory:"
          pwd
          echo "Files here:"
          ls -la
          flutter create --platforms=android --org com.thalo.app .
          echo "After flutter create:"
          ls -la
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
