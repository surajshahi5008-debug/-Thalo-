workflows:
  android-workflow:
    name: Thalo Android Build
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          set -e
          flutter create --platforms=android --org com.thalo.app .

      - name: Build Thalo APK
        script: |
          set -e
          flutter pub get
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
