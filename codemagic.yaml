workflows:
  android-workflow:
    name: Thalo Android Build
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          set -e
          flutter create --platforms=android --org com.thalo.app .

      - name: Configure Firebase for Android
        script: |
          set -e
          cp google-services.json android/app/google-services.json

          python3 - <<'PYEOF'
          # 1. Add google-services classpath to project-level build.gradle(.kts)
          for path in ["android/build.gradle.kts", "android/build.gradle"]:
              try:
                  with open(path) as f:
                      content = f.read()
              except FileNotFoundError:
                  continue
              if "google-services" in content:
                  break
              if path.endswith(".kts"):
                  addition = '        classpath("com.google.gms:google-services:4.4.2")\n'
              else:
                  addition = "        classpath 'com.google.gms:google-services:4.4.2'\n"
              content = content.replace("dependencies {", "dependencies {\n" + addition, 1)
              with open(path, "w") as f:
                  f.write(content)
              break

          # 2. Apply the plugin in app-level build.gradle(.kts)
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              try:
                  with open(path, "a") as f:
                      if path.endswith(".kts"):
                          f.write('\napply(plugin = "com.google.gms.google-services")\n')
                      else:
                          f.write("\napply plugin: 'com.google.gms.google-services'\n")
              except FileNotFoundError:
                  continue
              break
          PYEOF

      - name: Build Thalo APK
        script: |
          set -e
          flutter pub get
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
